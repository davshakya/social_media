[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hindi-science-video"
version = "0.1.0"
description = "Structured Hindi science storyboards to narrated vertical Blender videos"
requires-python = ">=3.11"
dependencies = ["openai>=1.68,<3", "pydantic>=2.10,<3", "python-dotenv>=1,<2", "imageio-ffmpeg>=0.6,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
publish = ["google-api-python-client>=2.160,<3", "google-auth-oauthlib>=1.2,<2", "requests>=2.32,<3"]
voice = ["edge-tts>=7,<8"]

[project.scripts]
science-video = "science_video.cli:main"
science-video-voice = "science_video.hinglish_voice:main"

[tool.setuptools.packages.find]
include = ["science_video*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
